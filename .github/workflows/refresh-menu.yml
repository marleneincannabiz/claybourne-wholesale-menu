name: Refresh Claybourne wholesale menu

on:
  schedule:
    # Cron times are UTC. GitHub drops or delays scheduled runs that start exactly
    # on the hour, so this fires hourly at :17 past, weekdays, 11:17-23:17 UTC
    # (about 6-7am through 6-7pm New York, depending on daylight saving).
    # Even if some runs are skipped, the menu stays fresh.
    - cron: "17 11-23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run refresh
        run: python refresh_menu.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html categories.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-debug
          path: download/
          retention-days: 3
